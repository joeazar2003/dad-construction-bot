        value: "Tabarja"
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_FILE_PATH
        value: "data/tabarja.xlsx"

  - type: web
    name: zaarour-expenses-bot
    env: python
    plan: free
